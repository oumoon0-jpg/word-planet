<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>单词星球</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; overflow: hidden; }
:root {
  --primary: #4ECDC4;
  --primary-dark: #3BA99C;
  --coral: #FF6B6B;
  --bg: #FFF8F0;
  --card: #FFFFFF;
  --success: #51CF66;
  --star: #FFD43B;
  --text: #2D3436;
  --text-light: #636e72;
  --shadow: 0 4px 15px rgba(0,0,0,0.08);
}
body {
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg); color: var(--text);
  max-width: 480px; margin: 0 auto;
  height: 100%; overflow: hidden;
  position: relative;
  -webkit-overflow-scrolling: touch;
}

/* === Login Screen === */
.login-screen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, #FFF8F0, #e8faf8);
  z-index: 500; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 30px; text-align: center;
}
.login-screen.hidden { display: none; }
.login-screen .logo { font-size: 64px; margin-bottom: 12px; }
.login-screen h1 { font-size: 28px; margin-bottom: 6px; color: var(--text); }
.login-screen .tagline { font-size: 14px; color: var(--text-light); margin-bottom: 32px; }
.login-input {
  width: 100%; max-width: 280px; padding: 14px 18px;
  border: 2px solid #e0e0e0; border-radius: 16px;
  font-size: 16px; text-align: center; outline: none;
  transition: border-color 0.2s;
}
.login-input:focus { border-color: var(--primary); }
.login-input::placeholder { color: #ccc; }
.login-btn {
  margin-top: 16px; padding: 14px 48px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white; border: none; border-radius: 16px;
  font-size: 17px; font-weight: 600; cursor: pointer;
  box-shadow: 0 6px 20px rgba(78,205,196,0.4);
  transition: transform 0.15s;
}
.login-btn:active { transform: scale(0.96); }
.login-btn:disabled { opacity: 0.4; }
.login-history { margin-top: 24px; width: 100%; max-width: 280px; }
.login-history-title { font-size: 13px; color: var(--text-light); margin-bottom: 8px; }
.login-user-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 12px 16px; margin-bottom: 8px;
  background: white; border: 1px solid #eee; border-radius: 12px;
  font-size: 15px; cursor: pointer; transition: transform 0.15s;
}
.login-user-btn:active { transform: scale(0.97); }
.login-user-btn .name { font-weight: 600; color: var(--text); }
.login-user-btn .info { font-size: 12px; color: var(--text-light); }
.login-user-btn .delete-user {
  color: #ccc; font-size: 18px; padding: 2px 6px;
  border: none; background: none; cursor: pointer;
  transition: color 0.2s;
}
.login-user-btn .delete-user:active { color: var(--coral); }

/* === User Bar (top) === */
.user-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 4px 0;
}
.user-bar .user-info {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; color: var(--text-light);
}
.user-bar .user-info .avatar { font-size: 22px; }
.user-bar .user-info .uname { font-weight: 600; color: var(--text); }
.user-bar .logout-btn {
  font-size: 12px; color: #bbb; background: none; border: 1px solid #ddd;
  padding: 4px 12px; border-radius: 20px; cursor: pointer;
}

/* === Tab Bar === */
.tab-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  display: flex; background: white;
  border-top: 1px solid #eee; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-bar .tab {
  flex: 1; text-align: center; padding: 10px 0 8px;
  font-size: 11px; color: #999; cursor: pointer;
  transition: color 0.2s; user-select: none;
}
.tab-bar .tab.active { color: var(--primary); }
.tab-bar .tab .icon { font-size: 22px; display: block; margin-bottom: 2px; }

/* === Pages === */
.page {
  display: none; padding: 20px 20px 80px;
  height: 100%; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.page.active { display: block; }

/* === Home === */
.home-header { text-align: center; padding: 12px 0 16px; }
.home-header h1 { font-size: 28px; margin-bottom: 4px; }
.home-header .subtitle { color: var(--text-light); font-size: 14px; }

.stats-row { display: flex; gap: 10px; margin: 16px 0; }
.stat-card {
  flex: 1; background: var(--card); border-radius: 16px;
  padding: 14px 8px; text-align: center; box-shadow: var(--shadow);
}
.stat-card .num { font-size: 26px; font-weight: 700; color: var(--primary); }
.stat-card .label { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.stat-card .num.star-color { color: var(--star); }

.start-btn {
  display: block; width: 100%; padding: 16px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white; border: none; border-radius: 16px;
  font-size: 18px; font-weight: 700; cursor: pointer;
  box-shadow: 0 6px 20px rgba(78,205,196,0.4);
  transition: transform 0.15s; margin-top: 16px;
}
.start-btn:active { transform: scale(0.96); }
.start-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

.today-words {
  margin-top: 16px; background: var(--card);
  border-radius: 16px; padding: 14px; box-shadow: var(--shadow);
}
.today-words h3 { font-size: 14px; margin-bottom: 10px; color: var(--text-light); }
.word-preview { display: flex; flex-wrap: wrap; gap: 6px; }
.word-chip {
  background: #f0faf9; color: var(--primary-dark);
  padding: 5px 10px; border-radius: 20px; font-size: 13px; font-weight: 500;
}

.data-section { margin-top: 16px; display: flex; gap: 10px; }
.data-btn {
  flex: 1; padding: 10px; background: var(--card);
  border: 1px solid #eee; border-radius: 12px;
  font-size: 13px; color: var(--text-light); cursor: pointer;
  text-align: center; transition: transform 0.15s;
}
.data-btn:active { transform: scale(0.96); }

/* === Learn Page === */
.learn-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0 16px;
}
.learn-header .back {
  font-size: 28px; cursor: pointer; color: var(--text-light);
  padding: 4px 8px; user-select: none;
}
.progress-text { font-size: 14px; color: var(--text-light); }
.progress-bar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 20px; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.3s; }

.word-card {
  background: var(--card); border-radius: 24px;
  padding: 28px 20px; text-align: center;
  box-shadow: var(--shadow);
}
.word-card .word { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
.word-card .phonics { font-size: 17px; color: #999; margin-top: 4px; }
.word-card .meaning { font-size: 20px; margin-top: 10px; color: var(--text); }

.tts-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 16px; padding: 10px 24px;
  background: #f0faf9; border: 2px solid var(--primary);
  border-radius: 30px; font-size: 15px; color: var(--primary-dark);
  cursor: pointer; font-weight: 600; user-select: none;
  transition: transform 0.15s;
}
.tts-btn:active { transform: scale(0.94); }

.canvas-wrap { margin-top: 16px; position: relative; }
.canvas-wrap canvas {
  width: 100%; height: 140px;
  border: 2px dashed #ddd; border-radius: 16px;
  background: #fafafa; touch-action: none;
  cursor: crosshair;
}
.canvas-label {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: #ccc; font-size: 15px; pointer-events: none;
}
.clear-canvas {
  margin-top: 6px; padding: 5px 14px;
  background: none; border: 1px solid #ddd; border-radius: 20px;
  color: #999; font-size: 12px; cursor: pointer;
}

.nav-btns { display: flex; gap: 10px; margin-top: 20px; }
.nav-btns button {
  flex: 1; padding: 14px; border: none; border-radius: 14px;
  font-size: 16px; font-weight: 600; cursor: pointer;
  transition: transform 0.15s; user-select: none;
  min-height: 48px;
}
.nav-btns button:active { transform: scale(0.95); }
.btn-prev { background: #f0f0f0; color: var(--text-light); }
.btn-next { background: var(--primary); color: white; }
.btn-exam { background: linear-gradient(135deg, var(--coral), #ee5a5a); color: white; }

/* === Exam === */
.exam-card {
  background: var(--card); border-radius: 24px;
  padding: 28px 20px; text-align: center;
  box-shadow: var(--shadow);
}
.exam-card .prompt { font-size: 15px; color: var(--text-light); margin-bottom: 12px; }
.exam-card .word { font-size: 30px; font-weight: 700; }
.exam-card .phonics { font-size: 17px; color: #999; margin-top: 4px; }

.exam-actions { display: flex; gap: 10px; margin-top: 16px; }
.exam-actions button {
  flex: 1; padding: 12px; border: none; border-radius: 14px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: transform 0.15s; min-height: 48px; user-select: none;
}
.exam-actions button:active { transform: scale(0.95); }
.btn-mistake { background: #fff3f3; color: var(--coral); border: 1px solid #ffd4d4; }
.btn-mistake.added { background: #f0fff0; color: var(--success); border-color: #c8f7c8; }
.btn-submit { background: var(--primary); color: white; }
.btn-dictation {
  margin-top: 10px; padding: 10px; width: 100%;
  background: #fff3f3; color: var(--coral); border: 1px solid #ffd4d4;
  border-radius: 12px; font-size: 14px; cursor: pointer; min-height: 44px;
}

/* === Calendar === */
.cal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 0 12px;
}
.cal-header h2 { font-size: 20px; }
.cal-nav {
  font-size: 24px; cursor: pointer; color: var(--text-light);
  padding: 4px 12px; user-select: none;
}
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 4px; text-align: center;
}
.cal-grid .day-label { font-size: 12px; color: #999; padding: 6px 0; }
.cal-grid .day {
  aspect-ratio: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  border-radius: 12px; font-size: 14px; cursor: pointer; position: relative;
  transition: background 0.2s;
}
.cal-grid .day:active:not(.empty) { background: #e0f0ef; }
.cal-grid .day.empty { cursor: default; }
.cal-grid .day.done { background: #e8faf8; color: var(--primary-dark); font-weight: 600; }
.cal-grid .day.done::after { content: "⭐"; font-size: 9px; }
.cal-grid .day.today {
  background: var(--primary); color: white; font-weight: 700;
  box-shadow: 0 3px 10px rgba(78,205,196,0.4);
}
.cal-grid .day.has-words { border: 2px solid var(--primary); }
.cal-grid .day.future { color: #ccc; }

/* === Day Detail Modal === */
.day-modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4); z-index: 300;
  display: none; align-items: flex-end; justify-content: center;
}
.day-modal-overlay.show { display: flex; }
.day-modal {
  background: white; border-radius: 24px 24px 0 0;
  width: 100%; max-width: 480px; max-height: 70vh;
  padding: 20px; overflow-y: auto;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.day-modal .modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.day-modal .modal-header h3 { font-size: 18px; }
.day-modal .modal-close {
  font-size: 24px; color: #999; cursor: pointer;
  padding: 4px 8px; user-select: none;
}
.day-modal .modal-status {
  display: inline-block; padding: 4px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 600; margin-bottom: 12px;
}
.day-modal .modal-status.done { background: #e8faf8; color: var(--primary-dark); }
.day-modal .modal-status.pending { background: #fff3e0; color: #f57c00; }
.day-modal .modal-status.future { background: #f5f5f5; color: #999; }
.day-modal .word-list { list-style: none; }
.day-modal .word-list li {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 1px solid #f0f0f0;
}
.day-modal .word-list li:last-child { border-bottom: none; }
.day-modal .word-list .w-word { font-size: 17px; font-weight: 600; }
.day-modal .word-list .w-phonics { font-size: 13px; color: #999; }
.day-modal .word-list .w-meaning { font-size: 14px; color: var(--text-light); text-align: right; }
.day-modal .word-list .w-speak {
  font-size: 20px; cursor: pointer; padding: 4px 8px; user-select: none;
}

/* === Mistakes === */
.mistake-list { margin-top: 12px; }
.mistake-item {
  background: var(--card); border-radius: 16px;
  padding: 14px; margin-bottom: 10px;
  box-shadow: var(--shadow);
  display: flex; justify-content: space-between; align-items: center;
}
.mistake-item .info .word { font-size: 17px; font-weight: 600; }
.mistake-item .info .meaning { font-size: 13px; color: var(--text-light); }
.mistake-item .info .meta { font-size: 11px; color: #bbb; margin-top: 2px; }
.mistake-item .remove-btn {
  background: #f0fff0; color: var(--success); border: none;
  padding: 8px 12px; border-radius: 12px; font-size: 12px; cursor: pointer;
  min-height: 36px; white-space: nowrap;
}
.empty-state { text-align: center; padding: 60px 20px; color: #ccc; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }

/* === Complete Screen === */
.complete-screen {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, #4ECDC4, #44B09E);
  z-index: 200; flex-direction: column;
  align-items: center; justify-content: center;
  color: white; text-align: center; padding: 20px;
}
.complete-screen.show { display: flex; }
.complete-screen .big-star { font-size: 72px; margin-bottom: 16px; animation: bounce 0.6s; }
.complete-screen h2 { font-size: 26px; margin-bottom: 8px; }
.complete-screen p { font-size: 15px; opacity: 0.9; margin-bottom: 24px; line-height: 1.6; }
.complete-screen button {
  padding: 14px 40px; background: white; color: var(--primary-dark);
  border: none; border-radius: 14px; font-size: 16px; font-weight: 600;
  cursor: pointer; min-height: 48px;
}

/* === Toast === */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.75); color: white; padding: 10px 20px;
  border-radius: 20px; font-size: 14px; z-index: 999;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* === Monthly Review === */
.monthly-banner {
  margin-top: 16px; padding: 16px; border-radius: 16px;
  background: linear-gradient(135deg, #fff3e0, #ffe0b2);
  box-shadow: var(--shadow); text-align: center; cursor: pointer;
  transition: transform 0.15s;
}
.monthly-banner:active { transform: scale(0.97); }
.monthly-banner .banner-icon { font-size: 36px; margin-bottom: 6px; }
.monthly-banner h3 { font-size: 16px; color: #e65100; margin-bottom: 4px; }
.monthly-banner p { font-size: 13px; color: #bf360c; }

.monthly-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0 16px;
}
.monthly-header .back {
  font-size: 28px; cursor: pointer; color: var(--text-light);
  padding: 4px 8px; user-select: none;
}
.monthly-result {
  background: var(--card); border-radius: 24px;
  padding: 28px 20px; text-align: center;
  box-shadow: var(--shadow); margin-top: 16px;
}
.monthly-result .score { font-size: 48px; font-weight: 700; color: var(--primary); }
.monthly-result .score-label { font-size: 14px; color: var(--text-light); margin-top: 4px; }
.monthly-result .detail { font-size: 15px; margin-top: 12px; line-height: 1.8; }

.monthly-word-display {
  background: var(--card); border-radius: 24px;
  padding: 28px 20px; text-align: center;
  box-shadow: var(--shadow);
}
.monthly-word-display .prompt { font-size: 15px; color: var(--text-light); margin-bottom: 8px; }
.monthly-word-display .meaning-hint {
  font-size: 18px; color: var(--text); margin-bottom: 16px;
  background: #f5f5f5; padding: 10px; border-radius: 12px;
}

.monthly-answer {
  margin-top: 8px; font-size: 16px; font-weight: 600;
  display: none;
}
.monthly-answer.show { display: block; }
.monthly-answer.correct { color: var(--success); }
.monthly-answer.wrong { color: var(--coral); }

@keyframes bounce {
  0% { transform: scale(0); }
  50% { transform: scale(1.3); }
  70% { transform: scale(0.9); }
  100% { transform: scale(1); }
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ===== Login Screen ===== -->
<div class="login-screen" id="login-screen">
  <div class="logo">🌍</div>
  <h1>单词星球</h1>
  <div class="tagline">每天10个单词，积少成多</div>
  <input class="login-input" id="login-name" type="text" placeholder="输入你的名字" maxlength="20"
    onkeydown="if(event.key==='Enter')doLogin()">
  <button class="login-btn" onclick="doLogin()">开始学习</button>
  <div class="login-history" id="login-history"></div>
</div>

<!-- ===== Tab Bar ===== -->
<nav class="tab-bar">
  <div class="tab active" onclick="showPage('home')"><span class="icon">🏠</span>首页</div>
  <div class="tab" onclick="showPage('calendar')"><span class="icon">📅</span>日历</div>
  <div class="tab" onclick="showPage('review')"><span class="icon">📝</span>听写</div>
  <div class="tab" onclick="showPage('mistakes')"><span class="icon">📕</span>错题本</div>
</nav>

<!-- ===== Home ===== -->
<div id="page-home" class="page active">
  <div class="user-bar">
    <div class="user-info">
      <span class="avatar">👤</span>
      <span class="uname" id="user-display-name"></span>
    </div>
    <button class="logout-btn" onclick="doLogout()">切换用户</button>
  </div>
  <div class="home-header">
    <h1>🌍 单词星球</h1>
    <div class="subtitle">每天10个单词，积少成多</div>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="num" id="stat-streak">0</div><div class="label">连续打卡</div></div>
    <div class="stat-card"><div class="num" id="stat-words">0</div><div class="label">已学单词</div></div>
    <div class="stat-card"><div class="num star-color" id="stat-stars">0</div><div class="label">⭐ 星星</div></div>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="num" id="stat-days">0</div><div class="label">学习天数</div></div>
    <div class="stat-card"><div class="num" id="stat-total">300</div><div class="label">总天数</div></div>
    <div class="stat-card"><div class="num" id="stat-pct">0%</div><div class="label">总进度</div></div>
  </div>
  <button class="start-btn" id="start-btn" onclick="startLearn()">📖 开始今日学习</button>
  <div class="today-words" id="today-preview"></div>
  <div id="monthly-banner-wrap"></div>
  <div class="data-section">
    <div class="data-btn" onclick="exportData()">📤 导出进度</div>
    <div class="data-btn" onclick="document.getElementById('import-file').click()">📥 导入进度</div>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</div>

<!-- ===== Learn ===== -->
<div id="page-learn" class="page">
  <div class="learn-header">
    <span class="back" onclick="exitLearn()">←</span>
    <span class="progress-text" id="learn-progress-text">1/10</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="learn-progress-bar"></div></div>
  <div class="word-card" id="word-card">
    <div class="word" id="learn-word"></div>
    <div class="phonics" id="learn-phonics"></div>
    <div class="meaning" id="learn-meaning"></div>
    <button class="tts-btn" onclick="speakCurrent()">🔊 朗读</button>
    <div class="canvas-wrap">
      <canvas id="learn-canvas"></canvas>
      <div class="canvas-label" id="canvas-label">✍️ 手写练习区</div>
    </div>
    <button class="clear-canvas" onclick="clearCanvas('learn')">清除</button>
  </div>
  <div class="nav-btns">
    <button class="btn-prev" id="btn-prev" onclick="prevWord()">← 上一个</button>
    <button class="btn-next" id="btn-next" onclick="nextWord()">下一个 →</button>
  </div>
</div>

<!-- ===== Exam ===== -->
<div id="page-exam" class="page">
  <div class="learn-header">
    <span class="back" onclick="exitLearn()">←</span>
    <span class="progress-text" id="exam-progress-text">考试 1/10</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="exam-progress-bar"></div></div>
  <div id="exam-read" class="exam-card">
    <div class="prompt">请朗读这个单词：</div>
    <div class="word" id="exam-word"></div>

<script src="words.js"></script>

<script>
// ============================================================
// Constants
// ============================================================
const WORDS_PER_DAY = 10;
const TOTAL_DAYS = Math.ceil(WORDS_ALL.length / WORDS_PER_DAY);
const USER_LIST_KEY = 'wordplanet_users';

// ============================================================
// User Management
// ============================================================
let currentUser = null;
let state = null;

function getUsers() {
  try { return JSON.parse(localStorage.getItem(USER_LIST_KEY)) || []; } catch(e) { return []; }
}
function saveUsers(users) { localStorage.setItem(USER_LIST_KEY, JSON.stringify(users)); }
function stateKey(name) { return 'wordplanet_u_' + name; }

function loadState() {
  if (!currentUser) return { days: {}, mistakes: {}, stars: 0, nextDay: 1 };
  try {
    const raw = localStorage.getItem(stateKey(currentUser));
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { days: {}, mistakes: {}, stars: 0, nextDay: 1 };
}
function saveState() {
  if (!currentUser) return;
  localStorage.setItem(stateKey(currentUser), JSON.stringify(state));
}

// Migrate old data (before user system) into the FIRST user only
function migrateOldData(name) {
  const old = localStorage.getItem('wordplanet_v2');
  if (!old) return;
  // Only migrate if no users exist yet (first login ever)
  const users = getUsers();
  if (users.length === 0 && !localStorage.getItem(stateKey(name))) {
    localStorage.setItem(stateKey(name), old);
    localStorage.removeItem('wordplanet_v2'); // clean up old key
  }
}

function showLoginScreen() {
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-name').value = '';
  const hist = document.getElementById('login-history');
  const users = getUsers();
  if (users.length) {
    let html = '<div class="login-history-title">已有用户，点击直接登录：</div>';
    users.forEach(u => {
      const st = loadUserPreview(u.name);
      const safeName = u.name.replace(/'/g,"\\'").replace(/"/g,"&quot;");
      html += `<div class="login-user-btn" onclick="quickLogin('${safeName}')">
        <span class="name">👤 ${u.name}</span>
        <span class="info">已学${st.days}天 / ${st.words}词</span>
        <span class="delete-user" onclick="event.stopPropagation();deleteUser('${safeName}')">✕</span>
      </div>`;
    });
    hist.innerHTML = html;
  } else {
    hist.innerHTML = '';
  }
}

function deleteUser(name) {
  if (!confirm(`确认删除用户「${name}」及其所有学习记录？\n此操作不可恢复！`)) return;
  // Remove from user list
  let users = getUsers();
  users = users.filter(u => u.name !== name);
  saveUsers(users);
  // Remove data
  localStorage.removeItem(stateKey(name));
  if (localStorage.getItem('wordplanet_lastuser') === name) {
    localStorage.removeItem('wordplanet_lastuser');
  }
  showToast('已删除用户 ' + name);
  showLoginScreen();
}

function loadUserPreview(name) {
  try {
    const raw = localStorage.getItem(stateKey(name));
    if (raw) {
      const s = JSON.parse(raw);
      const days = Object.keys(s.days).filter(k => s.days[k].status === 2).length;
      return { days, words: days * WORDS_PER_DAY };
    }
  } catch(e) {}
  return { days: 0, words: 0 };
}

function doLogin() {
  const input = document.getElementById('login-name');
  const name = input.value.trim();
  if (!name) { input.focus(); showToast('请输入你的名字'); return; }
  loginAs(name);
}

function quickLogin(name) { loginAs(name); }

function loginAs(name) {
  migrateOldData(name);
  currentUser = name;
  state = loadState();
  if (!state.nextDay) state.nextDay = 1;

  // Add to user list if new
  const users = getUsers();
  if (!users.find(u => u.name === name)) {
    users.push({ name, created: new Date().toISOString() });
    saveUsers(users);
  }

  // Remember last user
  localStorage.setItem('wordplanet_lastuser', name);

  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('user-display-name').textContent = name;
  refreshHome();
}

function doLogout() {
  currentUser = null;
  state = null;
  localStorage.removeItem('wordplanet_lastuser');
  showPage('home');
  showLoginScreen();
}

// ============================================================
// State helpers
// ============================================================
let currentIdx = 0;
let examIdx = 0;
let examMistakeAdded = false;
let todayWords = [];
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getCurrentDay() {
  const today = todayStr();
  if (state.days[today] && state.days[today].dayIndex) return state.days[today].dayIndex;
  if (!state.nextDay) state.nextDay = 1;
  return state.nextDay;
}

function getWordsForDay(dayIndex) {
  return WORDS_ALL.filter(w => w.day === dayIndex);
}

// ============================================================
// Toast
// ============================================================
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// Pages
// ============================================================
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['home','calendar','review','mistakes'][i] === name);
  });
  document.querySelector('.tab-bar').style.display = (name === 'learn' || name === 'exam' || name === 'monthly') ? 'none' : 'flex';
  if (name === 'home') refreshHome();
  if (name === 'calendar') renderCalendar();
  if (name === 'review') renderReviewHub();
  if (name === 'mistakes') renderMistakes();
}

// ============================================================
// Home
// ============================================================
function refreshHome() {
  if (!state) return;
  const today = todayStr();
  const dayData = state.days[today];
  const streak = calcStreak();
  const completedDays = Object.keys(state.days).filter(k => state.days[k].status === 2).length;
  const totalWords = completedDays * WORDS_PER_DAY;

  document.getElementById('stat-streak').textContent = streak;
  document.getElementById('stat-words').textContent = totalWords;
  document.getElementById('stat-stars').textContent = state.stars || 0;
  document.getElementById('stat-days').textContent = completedDays;
  document.getElementById('stat-total').textContent = TOTAL_DAYS;
  document.getElementById('stat-pct').textContent = Math.round(completedDays / TOTAL_DAYS * 100) + '%';

  const btn = document.getElementById('start-btn');
  if (dayData && dayData.status === 2) {
    btn.textContent = '✅ 今日已完成';
    btn.disabled = true;
  } else if (dayData && dayData.status === 1) {
    btn.textContent = '📖 继续学习';
    btn.disabled = false;
  } else {
    btn.textContent = '📖 开始今日学习';
    btn.disabled = false;
  }

  const dayIndex = getCurrentDay();
  todayWords = getWordsForDay(dayIndex);
  const preview = document.getElementById('today-preview');
  if (todayWords.length) {
    preview.innerHTML = `<h3>📋 今日单词（第${dayIndex}天 / 共${TOTAL_DAYS}天）</h3>
      <div class="word-preview">${todayWords.map(w => `<span class="word-chip">${w.word}</span>`).join('')}</div>`;
  } else if (dayIndex > TOTAL_DAYS) {
    preview.innerHTML = `<h3>🎉 恭喜！所有 ${WORDS_ALL.length} 个单词已学完！</h3>`;
    btn.textContent = '🎉 全部完成';
    btn.disabled = true;
  } else {
    preview.innerHTML = '';
  }

  // Monthly review banner
  renderMonthlyBanner();
}

function renderMonthlyBanner() {
  const wrap = document.getElementById('monthly-banner-wrap');
  const review = getMonthlyReviewInfo();
  if (!review) { wrap.innerHTML = ''; return; }

  const today = new Date();
  const isFirstDay = today.getDate() === 1;
  // Show banner on 1st of month, or if there's an unfinished monthly review
  const monthKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  const done = state.monthlyReviews && state.monthlyReviews[monthKey];

  if (done) {
    wrap.innerHTML = `<div class="monthly-banner" style="background:linear-gradient(135deg,#e8faf8,#c8f7c8);cursor:default">
      <div class="banner-icon">✅</div>
      <h3 style="color:var(--primary-dark)">本月听写已完成</h3>
      <p style="color:var(--primary-dark)">正确率 ${done.score}%（${done.correct}/${done.total}）</p>
    </div>`;
  } else if (review.words.length > 0) {
    wrap.innerHTML = `<div class="monthly-banner" onclick="startMonthlyReview()">
      <div class="banner-icon">📝</div>
      <h3>月度听写测试</h3>
      <p>上月学了 ${review.words.length} 个单词，来听写一下吧！</p>
    </div>`;
  } else {
    wrap.innerHTML = '';
  }
}

function getMonthlyReviewInfo() {
  if (!state) return null;
  const today = new Date();
  // Get last month
  let targetMonth = today.getMonth(); // 0-indexed, current month
  let targetYear = today.getFullYear();
  // We review LAST month's words
  targetMonth -= 1;
  if (targetMonth < 0) { targetMonth = 11; targetYear -= 1; }

  const monthStr = `${targetYear}-${String(targetMonth+1).padStart(2,'0')}`;

  // Find all completed days in last month
  const words = [];
  const dayIndices = new Set();
  Object.keys(state.days).forEach(ds => {
    if (ds.startsWith(monthStr) && state.days[ds].status === 2 && state.days[ds].dayIndex) {
      dayIndices.add(state.days[ds].dayIndex);
    }
  });

  dayIndices.forEach(di => {
    getWordsForDay(di).forEach(w => words.push(w));
  });

  return { words, monthStr };
}

function calcStreak() {
  let streak = 0;
  let d = new Date();
  const today = todayStr();
  if (!state.days[today] || state.days[today].status !== 2) {
    d.setDate(d.getDate() - 1);
  }
  while (true) {
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (state.days[ds] && state.days[ds].status === 2) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  return streak;
}

// ============================================================
// Export / Import
// ============================================================
function exportData() {
  const data = {
    version: 2, user: currentUser,
    exported: new Date().toISOString(),
    state: state
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `单词星球_${currentUser}_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 进度已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.state && data.state.days) {
        state = data.state;
        if (!state.nextDay) state.nextDay = 1;
        saveState();
        refreshHome();
        showToast('✅ 进度已恢复');
      } else {
        showToast('❌ 文件格式不正确');
      }
    } catch(err) {
      showToast('❌ 读取失败');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============================================================
// Learn
// ============================================================
function startLearn() {
  const dayIndex = getCurrentDay();
  todayWords = getWordsForDay(dayIndex);
  if (!todayWords.length) return;

  const today = todayStr();
  if (!state.days[today]) {
    state.days[today] = { status: 1, dayIndex, stars: 0 };
    saveState();
  }

  currentIdx = 0;
  showPage('learn');
  renderLearnCard();
  setTimeout(() => initCanvas('learn-canvas'), 50);
}

function renderLearnCard() {
  const w = todayWords[currentIdx];
  document.getElementById('learn-word').textContent = w.word;
  document.getElementById('learn-phonics').textContent = w.phonics;
  document.getElementById('learn-meaning').textContent = w.meaning;
  document.getElementById('learn-progress-text').textContent = `${currentIdx + 1}/${todayWords.length}`;
  document.getElementById('learn-progress-bar').style.width = `${(currentIdx + 1) / todayWords.length * 100}%`;
  document.getElementById('btn-prev').style.visibility = currentIdx === 0 ? 'hidden' : 'visible';

  const isLast = currentIdx === todayWords.length - 1;
  const btnNext = document.getElementById('btn-next');
  if (isLast) {
    btnNext.textContent = '进入考试 →';
    btnNext.className = 'btn-exam';
    btnNext.onclick = () => startExam();
  } else {
    btnNext.textContent = '下一个 →';
    btnNext.className = 'btn-next';
    btnNext.onclick = () => nextWord();
  }
  clearCanvas('learn');
  document.getElementById('canvas-label').style.display = '';
}

function prevWord() { if (currentIdx > 0) { currentIdx--; renderLearnCard(); } }
function nextWord() { if (currentIdx < todayWords.length - 1) { currentIdx++; renderLearnCard(); } }
function exitLearn() { showPage('home'); }

// ============================================================
// TTS
// ============================================================
function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.8;
    window.speechSynthesis.speak(u);
  }
}
function speakCurrent() { speak(todayWords[currentIdx].word); }
function speakExam() { speak(todayWords[examIdx].word); }

// ============================================================
// Canvas
// ============================================================
function initCanvas(canvasId) {
  const oldCanvas = document.getElementById(canvasId);
  if (!oldCanvas) return;
  const canvas = oldCanvas.cloneNode(true);
  oldCanvas.parentNode.replaceChild(canvas, oldCanvas);
  canvas.id = canvasId;

  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2D3436';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let isDrawing = false;
  let lastX, lastY;

  const getPos = (e) => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  const start = (e) => {
    e.preventDefault(); e.stopPropagation();
    isDrawing = true;
    const p = getPos(e);
    lastX = p.x; lastY = p.y;
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    const labelId = canvasId === 'learn-canvas' ? 'canvas-label' : 'exam-canvas-label';
    const label = document.getElementById(labelId);
    if (label) label.style.display = 'none';
  };
  const move = (e) => {
    if (!isDrawing) return;
    e.preventDefault(); e.stopPropagation();
    const p = getPos(e);
    const midX = (lastX + p.x) / 2;
    const midY = (lastY + p.y) / 2;
    ctx.quadraticCurveTo(lastX, lastY, midX, midY);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(midX, midY);
    lastX = p.x; lastY = p.y;
  };
  const end = () => { if (!isDrawing) return; isDrawing = false; ctx.beginPath(); };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
  canvas.addEventListener('touchcancel', end);
}

function clearCanvas(which) {
  const id = which === 'learn' ? 'learn-canvas' : which === 'monthly' ? 'monthly-canvas' : 'exam-canvas';
  const labelId = which === 'learn' ? 'canvas-label' : which === 'monthly' ? 'monthly-canvas-label' : 'exam-canvas-label';
  const c = document.getElementById(id);
  if (c) {
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
  }
  const label = document.getElementById(labelId);
  if (label) label.style.display = '';
}

// ============================================================
// Exam
// ============================================================
function startExam() {
  examIdx = 0;
  showPage('exam');
  renderExamCard();
}

function renderExamCard() {
  const w = todayWords[examIdx];
  document.getElementById('exam-word').textContent = w.word;
  document.getElementById('exam-phonics').textContent = w.phonics;
  document.getElementById('exam-progress-text').textContent = `考试 ${examIdx + 1}/${todayWords.length}`;
  document.getElementById('exam-progress-bar').style.width = `${(examIdx + 1) / todayWords.length * 100}%`;
  document.getElementById('exam-read').style.display = '';
  document.getElementById('exam-dictation').style.display = 'none';
  examMistakeAdded = !!state.mistakes[w.id];
  updateMistakeBtn();
}

function toggleExamMistake() {
  const w = todayWords[examIdx];
  if (!examMistakeAdded) {
    state.mistakes[w.id] = { word: w.word, meaning: w.meaning, phonics: w.phonics, count: (state.mistakes[w.id]?.count || 0) + 1, date: todayStr() };
    examMistakeAdded = true;
    showToast('📕 已加入错题本');
  } else {
    delete state.mistakes[w.id];
    examMistakeAdded = false;
    showToast('已移出错题本');
  }
  saveState();
  updateMistakeBtn();
}

function updateMistakeBtn() {
  ['btn-exam-mistake', 'btn-exam-mistake2'].forEach(id => {
    const btn = document.getElementById(id);
    if (!btn) return;
    if (examMistakeAdded) {
      btn.textContent = '✅ 已收录';
      btn.classList.add('added');
    } else {
      btn.textContent = '📕 错题本';
      btn.classList.remove('added');
    }
  });
}

function showDictation() {
  document.getElementById('exam-read').style.display = 'none';
  document.getElementById('exam-dictation').style.display = '';
  setTimeout(() => initCanvas('exam-canvas'), 50);
}

function submitDictation() { examNext(); }

function examNext() {
  if (examIdx < todayWords.length - 1) {
    examIdx++;
    renderExamCard();
  } else {
    finishToday();
  }
}

function finishToday() {
  const today = todayStr();
  state.days[today].status = 2;
  state.days[today].stars = 1;
  state.stars = (state.stars || 0) + 1;
  state.nextDay = (state.days[today].dayIndex || state.nextDay) + 1;

  const streak = calcStreak();
  let bonusMsg = '';
  if (streak === 7)  { state.stars += 3;  bonusMsg = '\n🎉 连续7天打卡奖励 +3 星星！'; }
  if (streak === 30) { state.stars += 10; bonusMsg = '\n🎉 连续30天打卡奖励 +10 星星！'; }
  if (streak === 100){ state.stars += 30; bonusMsg = '\n🎉 连续100天打卡奖励 +30 星星！'; }

  saveState();
  document.getElementById('complete-msg').textContent = `今日学习完成，获得 1 颗星星！${bonusMsg}`;
  document.getElementById('complete-screen').classList.add('show');
  launchConfetti();
}

function completeBack() {
  document.getElementById('complete-screen').classList.remove('show');
  showPage('home');
}

// ============================================================
// Calendar (interactive!)
// ============================================================
function calNav(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

function renderCalendar() {
  if (!state) return;
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('cal-title').textContent = `${calYear}年 ${months[calMonth]}`;

  const grid = document.getElementById('cal-grid');
  const labels = ['一','二','三','四','五','六','日'];
  let html = labels.map(l => `<div class="day-label">${l}</div>`).join('');

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const shift = firstDay === 0 ? 6 : firstDay - 1;
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < shift; i++) html += `<div class="day empty"></div>`;

  // Build a map: date string → dayIndex for completed days
  const dateToDay = {};
  Object.keys(state.days).forEach(ds => {
    if (state.days[ds].dayIndex) dateToDay[ds] = state.days[ds].dayIndex;
  });

  let monthDone = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
    const isDone = state.days[ds] && state.days[ds].status === 2;
    const isFuture = new Date(calYear, calMonth, d) > today;
    if (isDone) monthDone++;

    let cls = 'day';
    if (isToday) cls += ' today';
    else if (isDone) cls += ' done';
    else if (isFuture) cls += ' future';

    // Calculate which dayIndex this calendar date maps to
    // For past/today: show what was learned. For future: show what will be learned
    html += `<div class="${cls}" onclick="openDayModal('${ds}')">${d}</div>`;
  }
  grid.innerHTML = html;
  document.getElementById('cal-summary').textContent = `本月学习 ${monthDone} 天`;
}

// ============================================================
// Day Detail Modal
// ============================================================
function openDayModal(dateStr) {
  const overlay = document.getElementById('day-modal-overlay');
  const title = document.getElementById('modal-title');
  const statusWrap = document.getElementById('modal-status-wrap');
  const wordList = document.getElementById('modal-word-list');

  // Parse date
  const [y, m, d] = dateStr.split('-').map(Number);
  title.textContent = `${m}月${d}日`;

  const dayData = state.days[dateStr];
  const today = new Date();
  const thisDate = new Date(y, m-1, d);
  const isFuture = thisDate > today;
  const isToday = thisDate.toDateString() === today.toDateString();

  let dayIndex = null;
  let statusHtml = '';

  if (dayData && dayData.dayIndex) {
    // This date has learning record
    dayIndex = dayData.dayIndex;
    if (dayData.status === 2) {
      statusHtml = `<span class="modal-status done">✅ 已完成 · 第${dayIndex}天</span>`;
    } else {
      statusHtml = `<span class="modal-status pending">📖 学习中 · 第${dayIndex}天</span>`;
    }
  } else if (isToday) {
    // Today, not started
    dayIndex = getCurrentDay();
    statusHtml = `<span class="modal-status pending">📋 今日待学 · 第${dayIndex}天</span>`;
  } else if (isFuture) {
    // Future: calculate which day it would be
    // Days from today
    const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const diffDays = Math.floor((thisDate - todayDate) / 86400000);
    dayIndex = getCurrentDay() + diffDays;
    if (dayIndex > TOTAL_DAYS) {
      statusHtml = `<span class="modal-status future">📚 超出词库范围</span>`;
      dayIndex = null;
    } else {
      statusHtml = `<span class="modal-status future">🔮 预计 · 第${dayIndex}天</span>`;
    }
  } else {
    // Past, no record
    statusHtml = `<span class="modal-status future">— 未学习</span>`;
  }

  statusWrap.innerHTML = statusHtml;

  // Show words
  if (dayIndex) {
    const words = getWordsForDay(dayIndex);
    if (words.length) {
      wordList.innerHTML = words.map(w => `
        <li>
          <div>
            <div class="w-word">${w.word}</div>
            <div class="w-phonics">${w.phonics}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="w-meaning">${w.meaning}</div>
            <span class="w-speak" onclick="speak('${w.word.replace(/'/g,"\\'")}')">🔊</span>
          </div>
        </li>
      `).join('');
    } else {
      wordList.innerHTML = '<li style="justify-content:center;color:#ccc">暂无单词数据</li>';
    }
  } else {
    wordList.innerHTML = '<li style="justify-content:center;color:#ccc">暂无单词数据</li>';
  }

  overlay.classList.add('show');
}

function closeDayModal(event) {
  if (event && event.target !== document.getElementById('day-modal-overlay')) return;
  document.getElementById('day-modal-overlay').classList.remove('show');
}

// ============================================================
// Mistakes
// ============================================================
function renderMistakes() {
  if (!state) return;
  const list = document.getElementById('mistake-list');
  const ids = Object.keys(state.mistakes);
  if (!ids.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div>暂无错题，继续加油！</div></div>`;
    return;
  }
  list.innerHTML = `<p style="color:#999;font-size:13px;margin-bottom:8px">共 ${ids.length} 个单词</p>` +
    ids.map(id => {
      const m = state.mistakes[id];
      return `<div class="mistake-item">
        <div class="info">
          <div class="word">${m.word}</div>
          <div class="meaning">${m.meaning}</div>
          <div class="meta">收录于 ${m.date}</div>
        </div>
        <button class="remove-btn" onclick="removeMistake(${id})">✅ 已掌握</button>
      </div>`;
    }).join('');
}

function removeMistake(id) {
  delete state.mistakes[id];
  saveState();
  renderMistakes();
  showToast('已移出错题本');
}

// ============================================================
// Monthly Review
// ============================================================
let monthlyWords = [];
let monthlyIdx = 0;
let monthlyCorrect = 0;
let monthlyAnswered = false;
let monthlyMistakeAdded = false;

// ============================================================
// Review Hub
// ============================================================
function renderReviewHub() {
  if (!state) return;
  const wrap = document.getElementById('review-options');
  const emptyEl = document.getElementById('review-empty');

  // Collect completed dayIndices grouped by month
  const monthMap = {}; // "2026-05" → Set of dayIndex
  const allDayIndices = new Set();
  Object.keys(state.days).forEach(ds => {
    if (state.days[ds].status === 2 && state.days[ds].dayIndex) {
      const month = ds.substring(0, 7);
      if (!monthMap[month]) monthMap[month] = new Set();
      monthMap[month].add(state.days[ds].dayIndex);
      allDayIndices.add(state.days[ds].dayIndex);
    }
  });

  if (allDayIndices.size === 0) {
    wrap.innerHTML = '';
    emptyEl.style.display = '';
    return;
  }
  emptyEl.style.display = 'none';

  let html = '';

  // All words review
  const allWords = [];
  allDayIndices.forEach(di => getWordsForDay(di).forEach(w => allWords.push(w)));
  html += `<div class="monthly-banner" onclick="startReview('all')" style="margin-top:0;margin-bottom:12px">
    <div class="banner-icon">🎯</div>
    <h3>全部已学单词</h3>
    <p>共 ${allWords.length} 个单词</p>
  </div>`;

  // Per-month options
  const months = Object.keys(monthMap).sort().reverse();
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  months.forEach(m => {
    const [y, mo] = m.split('-');
    const count = monthMap[m].size * WORDS_PER_DAY;
    const days = monthMap[m].size;
    const mKey = m; // for review lookup
    const reviewDone = state.monthlyReviews && state.monthlyReviews[m];
    const doneTag = reviewDone ? `<span style="color:var(--success);font-size:12px"> ✅ ${reviewDone.score}%</span>` : '';
    html += `<div class="monthly-banner" onclick="startReview('${m}')" style="margin-top:0;margin-bottom:12px;background:linear-gradient(135deg,#f0faf9,#e0f0ef)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="color:var(--primary-dark);font-size:15px">${y}年${monthNames[parseInt(mo)-1]}</h3>
        ${doneTag}
      </div>
      <p style="color:var(--primary-dark);text-align:left">学了${days}天 · ${count}个单词</p>
    </div>`;
  });

  // Mistakes review
  const mistakeIds = Object.keys(state.mistakes);
  if (mistakeIds.length > 0) {
    html += `<div class="monthly-banner" onclick="startReview('mistakes')" style="margin-top:0;margin-bottom:12px;background:linear-gradient(135deg,#fff3f3,#ffd4d4)">
      <div class="banner-icon">📕</div>
      <h3 style="color:var(--coral)">错题本听写</h3>
      <p style="color:var(--coral)">${mistakeIds.length} 个错题单词</p>
    </div>`;
  }

  wrap.innerHTML = html;
}

function startReview(scope) {
  let words = [];

  if (scope === 'all') {
    const allDayIndices = new Set();
    Object.keys(state.days).forEach(ds => {
      if (state.days[ds].status === 2 && state.days[ds].dayIndex) {
        allDayIndices.add(state.days[ds].dayIndex);
      }
    });
    allDayIndices.forEach(di => getWordsForDay(di).forEach(w => words.push(w)));
  } else if (scope === 'mistakes') {
    Object.keys(state.mistakes).forEach(id => {
      const m = state.mistakes[id];
      words.push({ id: parseInt(id), word: m.word, meaning: m.meaning, phonics: m.phonics });
    });
  } else {
    // Month scope like "2026-05"
    const dayIndices = new Set();
    Object.keys(state.days).forEach(ds => {
      if (ds.startsWith(scope) && state.days[ds].status === 2 && state.days[ds].dayIndex) {
        dayIndices.add(state.days[ds].dayIndex);
      }
    });
    dayIndices.forEach(di => getWordsForDay(di).forEach(w => words.push(w)));
  }

  if (!words.length) { showToast('没有可听写的单词'); return; }
  startMonthlyReviewWithWords(words, scope);
}

function startMonthlyReview() {
  const review = getMonthlyReviewInfo();
  if (!review || !review.words.length) return;
  startMonthlyReviewWithWords(review.words, null);
}

let monthlyScope = null;

function startMonthlyReviewWithWords(words, scope) {
  monthlyWords = words.slice().sort(() => Math.random() - 0.5);
  monthlyIdx = 0;
  monthlyCorrect = 0;
  monthlyAnswered = false;
  monthlyScope = scope;

  showPage('monthly');
  document.getElementById('monthly-result').style.display = 'none';
  document.getElementById('monthly-card').style.display = '';
  renderMonthlyCard();
}

function renderMonthlyCard() {
  const w = monthlyWords[monthlyIdx];
  const total = monthlyWords.length;
  document.getElementById('monthly-progress-text').textContent = `听写 ${monthlyIdx + 1}/${total}`;
  document.getElementById('monthly-progress-bar').style.width = `${(monthlyIdx + 1) / total * 100}%`;
  document.getElementById('monthly-meaning').textContent = `💡 提示：${w.meaning}`;
  document.getElementById('monthly-answer').className = 'monthly-answer';
  document.getElementById('monthly-answer').style.display = 'none';
  document.getElementById('btn-monthly-next').textContent = '看答案';
  monthlyAnswered = false;
  monthlyMistakeAdded = !!state.mistakes[w.id];
  updateMonthlyMistakeBtn();
  clearCanvas('monthly');

  // Auto play sound
  setTimeout(() => {
    speakMonthlyWord();
    initCanvas('monthly-canvas');
  }, 300);
}

function speakMonthlyWord() {
  if (monthlyWords.length) speak(monthlyWords[monthlyIdx].word);
}

function monthlyNext() {
  if (!monthlyAnswered) {
    // Show answer — user self-judges
    monthlyAnswered = true;
    const w = monthlyWords[monthlyIdx];
    const answerEl = document.getElementById('monthly-answer');
    answerEl.textContent = `答案：${w.word}（${w.phonics}）`;
    answerEl.className = 'monthly-answer show';
    answerEl.style.display = 'block';
    answerEl.style.color = 'var(--primary-dark)';
    answerEl.style.fontSize = '20px';
    answerEl.style.fontWeight = '700';
    answerEl.style.marginTop = '12px';

    // Show correct/wrong buttons
    document.getElementById('btn-monthly-next').textContent = '✅ 写对了';
    document.getElementById('btn-monthly-next').onclick = () => monthlyJudge(true);

    // Replace mistake btn temporarily with "wrong" btn
    const mistakeBtn = document.getElementById('btn-monthly-mistake');
    mistakeBtn.textContent = '❌ 写错了';
    mistakeBtn.className = 'btn-mistake';
    mistakeBtn.onclick = () => monthlyJudge(false);
  }
}

function monthlyJudge(correct) {
  if (correct) {
    monthlyCorrect++;
    showToast('✅ 正确！');
  } else {
    showToast('❌ 记住了，下次加油');
    // Auto add to mistakes
    const w = monthlyWords[monthlyIdx];
    if (!state.mistakes[w.id]) {
      state.mistakes[w.id] = { word: w.word, meaning: w.meaning, phonics: w.phonics, count: 1, date: todayStr() };
      saveState();
    }
  }

  // Next or finish
  if (monthlyIdx < monthlyWords.length - 1) {
    monthlyIdx++;
    // Reset button handlers
    document.getElementById('btn-monthly-next').onclick = () => monthlyNext();
    document.getElementById('btn-monthly-mistake').onclick = () => toggleMonthlyMistake();
    renderMonthlyCard();
  } else {
    finishMonthlyReview();
  }
}

function toggleMonthlyMistake() {
  const w = monthlyWords[monthlyIdx];
  if (!monthlyMistakeAdded) {
    state.mistakes[w.id] = { word: w.word, meaning: w.meaning, phonics: w.phonics, count: (state.mistakes[w.id]?.count || 0) + 1, date: todayStr() };
    monthlyMistakeAdded = true;
    showToast('📕 已加入错题本');
  } else {
    delete state.mistakes[w.id];
    monthlyMistakeAdded = false;
    showToast('已移出错题本');
  }
  saveState();
  updateMonthlyMistakeBtn();
}

function updateMonthlyMistakeBtn() {
  const btn = document.getElementById('btn-monthly-mistake');
  if (monthlyMistakeAdded) {
    btn.textContent = '✅ 已收录';
    btn.classList.add('added');
  } else {
    btn.textContent = '📕 错题本';
    btn.classList.remove('added');
  }
}

function finishMonthlyReview() {
  const total = monthlyWords.length;
  const pct = Math.round(monthlyCorrect / total * 100);

  // Save result
  if (!state.monthlyReviews) state.monthlyReviews = {};
  const monthKey = monthlyScope || `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
  state.monthlyReviews[monthKey] = {
    score: pct, correct: monthlyCorrect, total,
    date: todayStr()
  };

  // Bonus stars
  let bonus = 0;
  if (pct >= 90) bonus = 5;
  else if (pct >= 70) bonus = 3;
  else if (pct >= 50) bonus = 1;
  state.stars = (state.stars || 0) + bonus;
  saveState();

  document.getElementById('monthly-card').style.display = 'none';
  document.getElementById('monthly-result').style.display = '';
  document.getElementById('monthly-score').textContent = pct + '%';

  let detail = `共 ${total} 词，正确 ${monthlyCorrect} 个`;
  if (bonus > 0) detail += `\n🌟 奖励 ${bonus} 颗星星！`;
  if (pct === 100) detail += '\n🎉 满分！太厉害了！';
  else if (pct >= 90) detail += '\n👏 非常棒！';
  else if (pct < 50) detail += '\n💪 继续加油，多复习错题本！';
  document.getElementById('monthly-detail').textContent = detail;

  if (pct >= 80) launchConfetti();
}

function exitMonthly() {
  showPage('review');
}

// ============================================================
// Confetti
// ============================================================
function launchConfetti() {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:300;overflow:hidden';
  document.body.appendChild(wrap);
  const colors = ['#FF6B6B','#4ECDC4','#FFD43B','#51CF66','#FF9FF3','#54A0FF','#FFA502'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    const size = Math.random() * 10 + 4;
    const delay = Math.random() * 0.5;
    const duration = Math.random() * 1.5 + 1.5;
    const x = Math.random() * 100;
    const rot = Math.random() * 720;
    c.style.cssText = `position:absolute;width:${size}px;height:${size}px;background:${colors[i%colors.length]};border-radius:${Math.random()>0.5?'50%':'2px'};left:${x}%;top:-10px;opacity:1;transform:translateY(0) rotate(0deg);transition:transform ${duration}s ease-out ${delay}s, opacity ${duration}s ease-out ${delay}s;`;
    wrap.appendChild(c);
    requestAnimationFrame(() => {
      c.style.transform = `translateY(${window.innerHeight + 50}px) rotate(${rot}deg)`;
      c.style.opacity = '0';
    });
  }
  setTimeout(() => wrap.remove(), 4000);
}

// ============================================================
// Init
// ============================================================
(function init() {
  const lastUser = localStorage.getItem('wordplanet_lastuser');
  if (lastUser && localStorage.getItem(stateKey(lastUser))) {
    // Auto-login last user
    loginAs(lastUser);
  } else {
    showLoginScreen();
  }
})();
